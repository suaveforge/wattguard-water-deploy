name: Bind Water Custom Domain
on:
  push:
    branches: [main]
    paths: ['.github/workflows/custom-domain.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register custom domain in GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          status=$(curl -sS -o /tmp/pages-put.json -w '%{http_code}' --max-time 30 \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"cname":"wattguard-water.suaveforge.com"}')
          echo "WATER_PAGES_DOMAIN_UPDATE_HTTP=$status"
          if [ "$status" != '204' ]; then
            sed -E 's/"message"/"error_message"/' /tmp/pages-put.json | head -c 600
            echo
            echo 'Pages API rejected update. Administrator may need to set Settings > Pages > Custom domain manually.'
            exit 1
          fi
          echo "WATER_PAGES_CUSTOM_DOMAIN_SET=yes"
